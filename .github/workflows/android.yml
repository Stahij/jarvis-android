name: Build Jarvis Android APK

on:
  push:
    branches: [ "main", "preview/**", "release/**", "release-signing-bootstrap", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "feature/qwen-2.5-3b-instruct" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build release-signed APK (requires repository signing secrets)"
        required: true
        type: boolean
        default: false
      publish_release:
        description: "Publish the signed APK as a GitHub Release for in-app updates"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish, for example v1.5.3"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: jarvis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: (github.event_name == 'workflow_dispatch' && (inputs.build_release || inputs.publish_release)) || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/feature/local-brain-and-updater' || github.ref == 'refs/heads/feature/jarvis-1.5.3-output-speed-updater' || github.ref == 'refs/heads/feature/qwen-2.5-3b-instruct' || github.ref == 'refs/heads/feature/jarvis-1.5.5-prefill-updater' || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/jarvis-1.5.5-prefill-updater')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing JARVIS_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing JARVIS_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing JARVIS_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing JARVIS_KEY_PASSWORD" && exit 1)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" "build-tools;35.0.0"
      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/jarvis-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-signing/jarvis-release.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-signing/jarvis-release.jks"
      - name: Diagnose signing credentials without exposing them
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/jarvis-signing/jarvis-release.jks
          STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set +x
          echo "Checking keystore password and alias..."
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "PASS: keystore password and alias are valid."
          echo "Checking private-key password..."
          set +e
          keytool -certreq -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/jarvis-signing/key-check.csr" >"$RUNNER_TEMP/jarvis-signing/keytool.stdout" 2>"$RUNNER_TEMP/jarvis-signing/keytool.stderr"
          KEY_CHECK_STATUS=$?
          set -e
          if [ "$KEY_CHECK_STATUS" -ne 0 ]; then
            echo "FAIL: private key could not be unlocked. Safe diagnostic follows:"
            cat "$RUNNER_TEMP/jarvis-signing/keytool.stderr"
            cat "$RUNNER_TEMP/jarvis-signing/keytool.stdout"
            exit "$KEY_CHECK_STATUS"
          fi
          rm -f "$RUNNER_TEMP/jarvis-signing/key-check.csr" "$RUNNER_TEMP/jarvis-signing/keytool.stdout" "$RUNNER_TEMP/jarvis-signing/keytool.stderr"
          echo "PASS: private-key password is valid."
      - name: Build signed release APK
        env:
          JARVIS_KEYSTORE_PATH: ${{ runner.temp }}/jarvis-signing/jarvis-release.jks
          JARVIS_STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          mkdir -p release
          cp "$APK" release/Jarvis-release.apk
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-release-signed-${{ github.sha }}
          path: release/Jarvis-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for in-app updates
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release/Jarvis-release.apk
